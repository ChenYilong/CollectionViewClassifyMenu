# CYLTagListView configuration (YAML, read by CYLTabBarController's CYLTabBarConfigurationParser).
title: "配置文件 YAML：左上角箭头"
titleImage: "system:heart"
selectionMode: "multiple"
defaultVisibleRows: 1
scrollEnabled: false
foldControl:
  position: "topLeading"
  content: "icon"
style:
  itemHeight: 32
  interitemSpacing: 10
  lineSpacing: 10
  sectionInsets: "{8, 16, 8, 16}"
  normal:
    cornerRadius: 6
    borderWidth: 0
    backgroundColor: "systemGray6"
    margin: 12
  selected:
    cornerRadius: 6
    borderWidth: 0
    backgroundColor: "#E6F7EE"
    textColor: "#07C160"
    margin: 12
sections:
  - title: "兴趣"
    items:
      - "跑步"
      - "篮球"
      - "摄影"
      - "读书会"
      - "旅行"
      - "美食"
      - "徒步"
      - "音乐"
  - title: "城市"
    items:
      - "北京"
      - "上海"
      - "深圳"
      - "杭州"
      - "海外"
