# CYLTagListView configuration (YAML, read by CYLTabBarController's CYLTabBarConfigurationParser).
title: "YAML file: chevron at the top leading edge"
titleImage: "system:heart"
selectionMode: "multiple"
defaultVisibleRows: 1
scrollEnabled: false
foldControl:
  position: "headerLeading"
  content: "icon"
style:
  itemHeight: 32
  interitemSpacing: 10
  lineSpacing: 10
  sectionInsets: "{8, 16, 8, 16}"
  normal:
    cornerRadius: 6
    borderWidth: 0
    backgroundColor: "systemGray6"
    margin: 12
  selected:
    cornerRadius: 6
    borderWidth: 0
    backgroundColor: "#E6F7EE"
    textColor: "#07C160"
    margin: 12
sections:
  - title: "Interests"
    items:
      - "Running"
      - "Basketball"
      - "Photography"
      - "Book Club"
      - "Travel"
      - "Food"
      - "Hiking"
      - "Music"
  - title: "Cities"
    items:
      - "Beijing"
      - "Shanghai"
      - "Shenzhen"
      - "Hangzhou"
      - "Overseas"
