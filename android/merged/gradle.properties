org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# CYLTabBarController for Android, by commit: settings.gradle.kts checks this commit out (sparse clone into .cyltabbar/)
# and builds its Example-Android modules in place of the Maven coordinates io.github.chenyilong:cyltabbarcontroller and
# :cyltabbarcontroller-pages. Update with ../../scripts/cyl-tabbar-latest-commit.sh (the newest commit on any branch).
cyl.tabbar.repo=https://github.com/ChenYilong/CYLTabBarController.git
cyl.tabbar.commit=1fddee22fb2ac06c2b5a9ba6e94952c3ec566c36
# Fallback when the clone fails (offline): a local CYLTabBarController checkout, absolute or relative to this folder.
cyl.tabbar.localPath=../../../CYLTabBarController
