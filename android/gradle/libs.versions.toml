# Versions shared by every Android project in android/: the same as CYLTabBarController's Example-Android
# (gradle/libs.versions.toml there), so the merged example builds with its tab bar library.
[versions]
agp = "8.7.3"
kotlin = "2.0.21"
appcompat = "1.7.0"
fragment = "1.8.5"
material = "1.12.0"
recyclerview = "1.3.2"
coordinatorlayout = "1.2.0"
customview = "1.1.0"
glide = "4.16.0"
# The animation libraries CYLTabBarController's engine finds by reflection (its own versions).
lottie = "6.6.2"
libpag = "4.5.98"
rive = "10.3.0"
robolectric = "4.14.1"
junit = "4.13.2"
androidx-test-core = "1.6.1"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
androidx-coordinatorlayout = { module = "androidx.coordinatorlayout:coordinatorlayout", version.ref = "coordinatorlayout" }
androidx-customview = { module = "androidx.customview:customview", version.ref = "customview" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
lottie = { module = "com.airbnb.android:lottie", version.ref = "lottie" }
libpag = { module = "com.tencent.tav:libpag", version.ref = "libpag" }
rive = { module = "app.rive:rive-android", version.ref = "rive" }
material = { module = "com.google.android.material:material", version.ref = "material" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
