name: CI

on:
  push:
    branches: [master, 'claude/**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Pick an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read)["devices"]
            ios = devices.select { |runtime, _| runtime.include?("iOS") }.sort_by { |runtime, _| runtime.scan(/\d+/).map(&:to_i) }
            phone = ios.reverse.flat_map { |_, list| list }.find { |d| d["name"].start_with?("iPhone") }
            puts phone && phone["udid"]')
          test -n "$udid"
          echo "SIM_DESTINATION=platform=iOS Simulator,id=$udid" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install pods
        run: |
          pod install
          (cd TagCollectionView && pod install)

      - name: Test CollectionViewClassifyMenu
        run: |
          set -o pipefail
          xcodebuild test -workspace CollectionViewClassifyMenu.xcworkspace \
            -scheme CollectionViewClassifyMenuTests -destination "$SIM_DESTINATION" \
            CODE_SIGNING_ALLOWED=NO | tee menu-test.log | grep -E "Test Case|error:|warning:|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" menu-test.log

      - name: Test TagCollectionView
        run: |
          set -o pipefail
          xcodebuild test -workspace TagCollectionView/TagCollectionView.xcworkspace \
            -scheme TagCollectionView -destination "$SIM_DESTINATION" \
            CODE_SIGNING_ALLOWED=NO | tee tag-test.log | grep -E "Test Case|error:|warning:|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" tag-test.log

      - name: Lint podspec
        run: scripts/pod-lint.sh lib

      - name: Lint podspec without allowing warnings
        continue-on-error: true
        run: |
          export XCODE_XCCONFIG_FILE="$PWD/scripts/pod-lint.xcconfig"
          pod lib lint CollectionViewClassifyMenu.podspec

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs
          path: '*-test.log'
